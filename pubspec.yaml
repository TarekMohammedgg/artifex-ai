name: artifex_ai
description: "Artifex Photo Editor - Powerful photo studio, on-device filters, background removal, and smart text scanner."
publish_to: "none"

version: 1.0.6+16

environment:
  sdk: ^3.8.1

dependencies:
  animated_text_kit: ^4.3.0
  cupertino_icons: ^1.0.8
  dash_chat_2: ^0.0.21
  firebase_ai: ^3.4.0
  firebase_app_check: ^0.4.9
  firebase_core: ^4.2.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_markdown_plus: ^1.0.0
  flutter_native_splash: ^2.4.4
  gal: ^2.3.2
  google_generative_ai: ^0.4.7
  google_mlkit_text_recognition: ^0.15.0
  http: ^1.5.0
  huggingface_client: ^1.0.1
  image_cropper: ^11.0.0
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  shimmer: ^3.0.0
  stability_image_generation: ^1.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/gemini_logo.png
    - assets/cat.jpeg
    - assets/normal_image.png
    - assets/start_image.png
    - assets/ai_image.png
    - assets/app_logo.png
    - assets/splash_logo.png
    - assets/splash_logo_android12.png
    - assets/artifex_icon_512.png

flutter_native_splash:
  color: "#5DE0E6"
  color_dark: "#5DE0E6"
  image: assets/splash_logo.png
  android_12:
    color: "#5DE0E6"
    color_dark: "#5DE0E6"
    image: assets/splash_logo_android12.png
    icon_background_color: "#5DE0E6"
    icon_background_color_dark: "#5DE0E6"
